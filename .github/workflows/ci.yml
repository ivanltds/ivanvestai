name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  bot-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pip install ruff
      - run: ruff check .

  web-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run lint
      - run: npm run build

# Deploy fica a cargo da integração nativa GitHub <-> Vercel (root path: web/).
# Este workflow cobre só lint/build como gate de qualidade.
