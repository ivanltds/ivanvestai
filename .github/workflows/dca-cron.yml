name: IvanvestAI DCA Cron

on:
  schedule:
    # Executa todos os dias ao meio-dia (UTC), o que é 09:00 no horário de Brasília
    - cron: '0 12 * * *'
  workflow_dispatch: # Permite rodar o robô manualmente clicando em um botão

jobs:
  run-dca-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar IvanvestAI
        env:
          EXCHANGE_ID: ${{ secrets.EXCHANGE_ID }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
          DCA_SYMBOL: ${{ vars.DCA_SYMBOL }}
          DCA_AMOUNT_FIAT: ${{ vars.DCA_AMOUNT_FIAT }}
          DCA_CURRENCY: ${{ vars.DCA_CURRENCY }}
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: |
          python main.py
